name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: agentbox:ci

  node:
    name: verify-browser Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # lib.test.mjs exercises the pure logic only; no Playwright install needed.
      - name: node --test
        working-directory: verify-browser
        run: node --test

  docker-verify-browser:
    name: verify-browser Docker build smoke test
    runs-on: ubuntu-latest
    needs: [go, node]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: verify-browser/Dockerfile
          platforms: linux/amd64
          push: false
          tags: verify-browser:ci
