name: Release verify-browser

# Its own tag prefix. An agentbox tag (v1.2.3) can't match this filter, and
# release.yml excludes `verify-browser-v*` explicitly — its `v*.*.*` would
# otherwise match `verify-browser-v1.0.0` too, since `*` spans the "erify-…".
on:
  push:
    tags: ['verify-browser-v*.*.*']

env:
  REGISTRY_DOCKERHUB: docker.io/deploymenthq/verify-browser
  REGISTRY_GHCR: ghcr.io/deployment-io/verify-browser

jobs:
  release:
    name: Build and push verify-browser image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/verify-browser-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Go build, vet, test (gate release)
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node tests (gate release)
        working-directory: verify-browser
        run: node --test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: verify-browser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_DOCKERHUB }}:latest
            ${{ env.REGISTRY_GHCR }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_GHCR }}:latest
